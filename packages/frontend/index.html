<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EternalOS</title>

    <!-- Default SEO meta tags (updated dynamically by React) -->
    <meta name="description" content="Your corner of the internet. A personal desktop in the browser with classic Mac OS aesthetics." />

    <!-- OpenGraph defaults -->
    <meta property="og:title" content="EternalOS" />
    <meta property="og:description" content="A personal desktop in the browser. No algorithms. No feeds. Just you." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EternalOS" />
    <meta property="og:image" content="https://eternalos.me/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An EternalOS desktop with a Welcome window" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EternalOS" />
    <meta name="twitter:description" content="A personal desktop in the browser. No algorithms. No feeds. Just you." />
    <meta name="twitter:image" content="https://eternalos.me/og-default.png" />

    <!-- Theme color for mobile browsers (matches the manifest) -->
    <meta name="theme-color" content="#C0C0C0" />

    <!-- PWA manifest + iOS install support -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EternalOS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
